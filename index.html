<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<title>Bilancia Arnia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, sans-serif;
    background:#1a1a2e; color:#eee;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:20px; gap:16px;
  }
  h1 { font-size:1.1rem; color:#ffd54f; letter-spacing:1px; }
  #stato { font-size:.85rem; color:#888; min-height:1.2em; text-align:center; }
  #totale {
    font-size:17vw; font-weight:700; line-height:1.1;
    color:#4fc3f7; font-variant-numeric: tabular-nums;
  }
  #totale small { font-size:.35em; color:#888; }
  .celle {
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    width:100%; max-width:420px;
  }
  .cella {
    background:#16213e; border-radius:12px; padding:14px;
    text-align:center;
  }
  .cella .nome { font-size:.75rem; color:#888; }
  .cella .val {
    font-size:1.5rem; font-weight:600; color:#aed581;
    font-variant-numeric: tabular-nums;
  }
  #info { font-size:.8rem; color:#666; }
  button {
    background:#ffd54f; color:#1a1a2e; border:0; border-radius:24px;
    padding:14px 32px; font-size:1rem; font-weight:700;
  }
  button.connesso { background:#ef5350; color:#fff; }
  #err { color:#ef5350; font-size:.8rem; text-align:center; max-width:420px; }
</style>
</head>
<body>
  <h1>🐝 BILANCIA ARNIA</h1>
  <div id="stato">Non connesso</div>
  <div id="totale">--<small> kg</small></div>
  <div class="celle">
    <div class="cella"><div class="nome">CELLA 1</div><div class="val" id="c1">--</div></div>
    <div class="cella"><div class="nome">CELLA 2</div><div class="val" id="c2">--</div></div>
    <div class="cella"><div class="nome">CELLA 3</div><div class="val" id="c3">--</div></div>
    <div class="cella"><div class="nome">CELLA 4</div><div class="val" id="c4">--</div></div>
  </div>
  <div id="info"></div>
  <button id="btn">CONNETTI BILANCIA</button>
  <div id="err"></div>

<script>
const $ = id => document.getElementById(id);
const UUID_SERVIZIO = 'b1ee0001-0000-1000-8000-00805f9b34fb';
const UUID_PESI     = 'b1ee0002-0000-1000-8000-00805f9b34fb';

let device = null;
let connesso = false;

function mostraPesi(dv) {
  // payload: 5x int32 LE (C1..C4, TOT) in grammi
  if (dv.byteLength < 20) return;
  const g = [];
  for (let k = 0; k < 5; k++) g.push(dv.getInt32(k * 4, true));
  $('totale').innerHTML = (g[4] / 1000).toFixed(3) + '<small> kg</small>';
  for (let k = 0; k < 4; k++)
    $('c' + (k + 1)).textContent = (g[k] / 1000).toFixed(3);
  $('info').textContent = 'aggiornato ' + new Date().toLocaleTimeString();
}

function setConnesso(on) {
  connesso = on;
  $('btn').textContent = on ? 'DISCONNETTI' : 'CONNETTI BILANCIA';
  $('btn').classList.toggle('connesso', on);
  $('stato').textContent = on ? '📡 Connesso — dati live' : 'Non connesso';
}

async function connetti() {
  $('err').textContent = '';
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'Arnia01' }],
      optionalServices: [UUID_SERVIZIO]
    });

    device.addEventListener('gattserverdisconnected', () => setConnesso(false));

    $('stato').textContent = 'Connessione...';
    const server  = await device.gatt.connect();
    const serv    = await server.getPrimaryService(UUID_SERVIZIO);
    const chPesi  = await serv.getCharacteristic(UUID_PESI);

    chPesi.addEventListener('characteristicvaluechanged',
                            ev => mostraPesi(ev.target.value));
    await chPesi.startNotifications();

    // lettura iniziale immediata, senza aspettare la prima notifica
    try { mostraPesi(await chPesi.readValue()); } catch (e) {}

    setConnesso(true);
  } catch (e) {
    $('err').textContent = e.message || String(e);
    setConnesso(false);
  }
}

function disconnetti() {
  if (device && device.gatt.connected) device.gatt.disconnect();
  setConnesso(false);
}

$('btn').addEventListener('click', () => connesso ? disconnetti() : connetti());

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
